[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contrast-weighted-centerline-loss"
version = "0.1.0"
description = "Contrast-weighted tolerance-F1 (CTF) loss for faint thin-vessel segmentation"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-image>=0.19",
    "torch>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
segloss-demo = "segloss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
